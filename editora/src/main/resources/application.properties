spring.application.name=editora

### Server configuration ###
server.servlet.context-path=/editora
server.port=8000

### Database configuration ###
spring.datasource.url=jdbc:postgresql://localhost:5433/editora
# Lidos das variáveis de ambiente DB_USERNAME / DB_PASSWORD; o valor após ':' é o padrão local
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=update